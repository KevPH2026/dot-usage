name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Python 侧：语法、导入、数据源配置自检。放 ubuntu 是因为 runner 队列快，几秒出结果。
  # 跑 3.11 和 3.12：3.11 是下限（tomllib 从 3.11 才进标准库），必须验证。
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: 语法与导入检查
        run: |
          python3 -m compileall -q src
          PYTHONPATH=src python3 -c "import dotusage.cli"
      - name: 数据源配置自检
        run: |
          PYTHONPATH=src python3 -m dotusage.cli sources
      - name: 内置配置不能是空的
        # 这条守的是「配置静默读空」那类坑：
        # 解释器版本不对时 tomllib 缺失，配置会被读成空，采集还「成功」但一行数据都没有。
        run: |
          PYTHONPATH=src python3 -c "
          from dotusage.sources.loader import load_config
          specs = load_config()
          assert specs, '内置数据源配置读出来是空的 —— 配置读失败不能静默通过'
          print(f'内置源 {len(specs)} 个：', ', '.join(s.id for s in specs))
          "
      - name: 统计窗口可配且能算对
        # 窗口是拿来跟各工具自己的用量页对数字的：
        # ZCode 的统计只有 全部/7天/30天，没有近24h，窗口不对就永远对不上账。
        run: |
          PYTHONPATH=src python3 -c "
          from dotusage.sources.window import parse_window
          import time
          now = time.time()
          for spec, expect_start in [('24h', now-86400), ('7d', now-7*86400), ('30d', now-30*86400)]:
              start, label = parse_window(spec, now=now)
              assert abs(start - expect_start) < 2, (spec, start, expect_start)
              assert label, spec
          start, label = parse_window('today', now=now)
          assert label == '今天'
          assert start <= now
          start, label = parse_window('all')
          assert start == 0 and label == '全部'
          print('窗口解析 OK')
          "
      - name: 用户配置深合并（只覆盖写了的那几项）
        run: |
          PYTHONPATH=src python3 -c "
          from dotusage.sources.loader import _merge_spec
          base = {'id': 'x', 'adapter': 'builtin', 'options': {'window': '24h', 'db': '/a.db'}}
          merged = _merge_spec(base, {'id': 'x', 'options': {'window': '7d'}})
          assert merged['options'] == {'window': '7d', 'db': '/a.db'}, merged
          assert merged['adapter'] == 'builtin'
          print('深合并 OK')
          "

  # 菜单栏 App：macOS 专属（AppKit），只能在 macOS runner 上编译。
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: 编译 DotUsageBar
        run: |
          cd macos
          mkdir -p build
          swiftc -O -parse-as-library -target arm64-apple-macos13.0 DotUsageBar.swift -o build/DotUsageBar
          test -x build/DotUsageBar
