# dot-usage 默认数据源
#
# 每个 [[source]] 描述一个工具：去哪儿读、算它属于哪个平台。
# 想加自己的工具 → 复制一段改改 → docs/SOURCES.md
# 改完跑 `python -m dotusage sources` 看效果。

# ── ChatGPT / Codex ────────────────────────────────────────────────
[[source]]
id = "codex"
name = "Codex"
platform = "ChatGPT"
icon = "chatgpt"
adapter = "builtin"
builtin = "codex"
official = "chatgpt"

