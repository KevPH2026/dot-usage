# ══════════════════════════════════════════════════════════════════
# 下面是「通用适配器」的例子 —— 不改 Python 代码就能接新的工具。
# 把 adapter 改成 sqlite_usage / jsonl_usage 即可。
# ══════════════════════════════════════════════════════════════════

# [[source]]
# id = "mytool"
# name = "MyTool"
# platform = "自家"
# icon = "chatgpt"
# adapter = "sqlite_usage"
#
# [source.options]
# db = "~/.mytool/data.db"
# sql = """
#     SELECT model AS model, ts AS ts,
#            input_tokens AS input, output_tokens AS output,
#            total_tokens AS total, cost_usd AS cost
#     FROM usage
#     WHERE ts > :since
# """
# time_scale = 0.001
# window_hours = 24

# [[source]]
# id = "mytool2"
# name = "MyTool2"
# platform = "自家"
# adapter = "jsonl_usage"
#
# [source.options]
# glob = "~/.mytool2/sessions/**/*.jsonl"
# model = "message.model"
# input = "message.usage.input_tokens"
# output = "message.usage.output_tokens"
# ts = "timestamp"

# ══════════════════════════════════════════════════════════════════
# 输出目标（sink）开关
# 加新的输出目标只要往这里加一段 [sink.<名字>]，
# 核心采集代码不用动。
# ══════════════════════════════════════════════════════════════════

# local = 写本地状态文件 state.json（桌面端读它）
[sink.local]
enabled = true

# dot = 推墨水屏设备
[sink.dot]
enabled = true
